<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Laura ❤ Nil — LauraiNil_OS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- Botons de la cantonada -->
      <div id="topbar">
        <button id="btnMute" class="cornerbtn" aria-label="So">♪</button>
        <button id="btnFull" class="cornerbtn" aria-label="Pantalla completa">⛶</button>
      </div>

      <!-- Controls tàctils (només mòbil/tauleta) -->
      <div id="touch" class="hidden">
        <div id="dpad">
          <button class="dbtn" data-dir="up">▲</button>
          <button class="dbtn" data-dir="left">◀</button>
          <button class="dbtn" data-dir="right">▶</button>
          <button class="dbtn" data-dir="down">▼</button>
        </div>
        <div id="abtns">
          <button class="actbtn" data-act="b">B</button>
          <button class="actbtn" data-act="a">A</button>
        </div>
      </div>

      <!-- Pista de "tap per continuar" -->
      <div id="tapHint" class="hidden">Toca la pantalla per continuar</div>
    </div>
  </div>

  <!-- Ordre de càrrega important -->
  <script src="src/core.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/achievements.js"></script>
  <script src="src/dialogue.js"></script>
  <script src="src/scenes_terminal.js"></script>
  <script src="src/scenes_levels.js"></script>
  <script src="src/scenes_boss.js"></script>
  <script src="src/scenes_emotional.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
